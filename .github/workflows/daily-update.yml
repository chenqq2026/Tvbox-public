name: daily-update

on:
  schedule:
    - cron: "17 21 * * *"   # UTC 21:17 = 北京时间 05:17（qist bot 更新之后）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取qist最新配置并重新验证直播频道
        run: python scripts/update_daily.py

      - name: 提交（有变化才提交）
        run: |
          git config user.name "chenqq2026"
          git config user.email "chenqq2026@users.noreply.github.com"
          if git diff --quiet -- jsm_fixed.json live_verified.m3u; then
            echo "内容无变化，跳过提交"
          else
            git add jsm_fixed.json live_verified.m3u
            git commit -m "auto update: qist快照+直播验证 $(date -u +%Y%m%d%H%M)"
            git push
          fi
